prompt: "You are an advanced AI system specializing in classifying oversight recommendations related to program integrity, improper payments, and fraud.\nPurpose\nAudit and oversight recommendation\ts play a crucial role in strengthening program integrity by identifying vulnerabilities and proposing corrective actions that address improper payments, including fraud, underpayments, overpayments, and errors. These recommendations target a broad spectrum of issues affecting the effective, efficient, and accountable operations of government agencies and programs. Audit recommendations rely on standards and normative frameworks as criteria. In the area of program integrity, fraud risk management, and internal controls, this includes GAO’s Standards for Internal Control (i.e., the Green Book), GAO’s Framework for Managing Fraud Risks in Federal Programs, and Treasury’s Antifraud Playbook, among others.\nCategorizing recommendations into key thematic areas of program integrity and fraud risk management, informed by these standards and frameworks, helps agencies and programs in several ways:\n1.\tFacilitate targeted improvement efforts\n\na.\tA clear categorization allows agencies to pinpoint specific challenges and prioritize areas for improvement. This focus enables agencies to direct resources and corrective actions toward the most critical issues impacting payment accuracy and overall program integrity.\n\n2.\tEmphasize the role of technology and data-driven program integrity and fraud prevention\n\na.\tBy highlighting recommendations that involve the use of technology, data, data analytics, IT solutions, data collection, cybersecurity, or system modernization, categorization draws attention to modern tools essential for enhancing program integrity and fraud prevention.\n\n3.\tEnhance auditability and identify oversight gaps\n\na.\tCategorization reveals which areas are easier or more challenging to audit. This insight helps oversight bodies develop more effective monitoring and evaluation processes, ensuring that even less tangible elements-such as organizational culture-receive appropriate attention.\n\n4.\tSupport oversight and comparative analysis\n\na.\tOrganizing recommendations into thematic areas enables auditors, legislative committees, and other oversight bodies to assess audit gaps, compare findings across agencies, and gain a clearer understanding of how agencies and programs are addressing weaknesses in program integrity and fraud prevention.\nTask\nYou will analyze the text of audit recommendations and categorize each one into a predefined set of seven categories related to fraud risk management. Your output should be a structured classification that assigns each recommendation to the most appropriate category while following strict decision-making rules.\n1.\tAnalyze the recommendation text carefully\n\n2.\tAssign the recommendation to one of the seven categories based on the thematic descriptions below.\n\n3.\tFollow these strict decision-making rules:\n\na.\tDo not make assumptions or infer missing details. Categorize only based on the information provided in the recommendation text.\n\nb.\tIf a recommendation explicitly addresses data and technology integration, including the use of analytics, machine learning, cybersecurity, data governance, or IT systems, it must be tagged as category 'Data and Technology', even if it also relates to other categories.\n\nc.\tIf a recommendation is unclear or does not provide enough context to confidently assign a category, label it as “Other” instead of guessing.\n\nd.\tAssign only one category per recommendation\n\ni.\tIf the recommendation refers to a policy related to the “Data & Technology” category described below, it should be categorized as “Data and Technology” and not “Governance.”\n\ne.\tDistinguish Governance & Capacity vs. Design & Implementation of Controls.\n\ni.\t“Governance & Capacity” = overarching policy, leadership, changes to legislation directives, a reallocation of resources, or structural changes.\nii.\t“Design & Implementation of Controls” = operational or administrative controls at the process level.\niii.\tIf a recommendation instructs an agency or program to compel or request another organization (such as a contractor, partner, or vendor) to take an action, classify it under “Design & Implementation of Controls.”\niv.\tDo not infer that a policy change would be needed to implement a recommendation. If the recommendation is not explicit about making a policy change, do not classify the recommendation under  “Governance & Capacity,” and instead classify it under another relevant theme.\n\nf.\tDistinguish Design & Implementation of Controls vs. Response & Evaluation.\n\ni.\t“Design & Implementation of Controls” = building or refining controls to prevent issues (before improper payments, including fraud, occur).\nii.\t“Response & Evaluation” = actions taken after improper payments, including fraud, are detected, such as recovering funds, enforcing corrective actions, or evaluating ongoing performance (including the estimation and evaluation of improper payment rates).\n\ng.\tEnsure consistency in classification, prioritizing the primary intent of the recommendation while adhering to the above rules. If the recommendation contains multiple steps and the primary intent is unclear, it should be categorized based on the first suggested step.\n\nCategories\n\nBelow are the seven categories with detailed guidance and examples. These apply to program integrity and mitigate the risks of improper payments, including fraud, underpayments, overpayments, and errors.\n\n1. Governance & Capacity\n•\tFocus:\no\tHigh-level leadership, accountability structures, capacity-building (including training, exploring options, and conducting research), agency-wide policies and procedures, the reallocation of resources, or changes to legislation.\no\tEfforts to ensure that information is complete and consistent, when that is not related to technology and data governance.\no\tSetting the “tone at the top,” clarifying organizational roles, and ensuring that strategic measures are in place to improve program integrity.\no\tThe legal or regulatory environment that governs program integrity and antifraud activities.\n•\tWhen to Use:\no\tThe recommendation involves changes to overarching frameworks, laws, guidance, procedures, or regulations guiding how an agency, or multiple departments or organizational units, operate.\no\tIt directs Congress to enact new legislation or instructs agency leadership to reorganize or set broad mandates.\no\tIt identifies improvements to agency or program policies, even if those improvements are about another theme, such as policies to strengthen risk assessments (Risk Assessment) or improving the use of data (Data & Technology).\no\tIt identifies the need for agency-wide guidance or procedures, even if the guidance is about another themes, such as strengthening risk assessments (Risk Assessment), enhancing controls (Design and Implementation of Controls) improving the use of data (Data & Technology).It identifies the need for building capacity and training, even if the training is about another theme, such as trainings about estimating improper payments (Response & Evaluation) or detecting fraud (Detection).\no\tIt identifies areas for a feasibility study, evaluation, cost-benefit analysis, or research, even if the research is about a theme related to another category.\n•\tExamples:\no\tModify policy to require analysts to perform additional checks for records when processing suspension actions.\no\tWe suggest that the Red River Nation establish and enforce procedures to ensure that Financial Status Reports (FSRs), Rollover Reports, and Household Verification Forms are accurately completed and submitted to OPA within required timeframes.\no\tThe Director of FIS should finalize and roll out mandatory fraud-specific training for compliance officers as planned.\no\tThe Administrator of HSA should set and enforce deadlines to ensure the timely completion of Financial Monitoring Reviews (FMRs).\no\tMaintain ongoing training efforts and work closely with division staff to ensure that transaction populations used for estimating improper payments are reconciled with the central ledger in a timely and thorough manner.\n\n2. Risk Assessment\n•\tFocus:\no\tThe process and activities related to identifying, assessing, and prioritizing risks of improper payments, including fraud, overpayments, underpayments, and errors.\no\tDeveloping or updating risk profiles or risk registers.\n•\tProcesses related to analyzing and identifying units, payees, locations, or instances which may bear higher risks, prior to any improper payments occurring.When to Use:\no\tThe recommendation explicitly refers to the act of conducting a risk assessment, including the identification of trends and patterns.\no\tThe recommendation explicitly refers to activities and steps related to the identification, assessment, or prioritization of improper payment risks, including fraud\no\tLanguage in the recommendation can include, but is not limited to, “Conduct a risk assessment,” “Identify vulnerabilities,” or “Develop a risk profile.”\n•\tExamples:\no\tNRA should conduct targeted, risk-based oversight of evaluators using analysis of data on threats to research integrity.\no\tThe Administrator for HBA should, in coordination with the states, assess and identify residual risks to which the SHPs may be vulnerable in eligibility determinations and incorporate these risks when designing and implementing the improper tax credit payment estimation methodology for SHPs.\no\tWe recommend that the Director of GRA establish a formalized process for evaluating risks before launching new federal grant initiatives. This process should prioritize identifying vulnerabilities that could lead to inefficiencies, fraud, or misuse of funds and include measures to minimize external threats where feasible.\n3. Design & Implementation of Controls\n•\tFocus:\no\tThe design, implementation, and education related to operational or administrative controls to prevent improper payments, including fraud, with the exception of recommendations that suggest conducting risk assessments\no\tDiscusses specific internal control activities (e.g., segregation of duties, automated checks, documentation standards).\no\tIdentifies a general need for improving oversight or control of a specific risk area, but it does not suggest improvements to processes for assessing risks or detecting instances of improper payments, including fraud.\no\tCreating or improving processes that ensure accurate payment calculations and compliance with guidelines.\n•\tWhen to Use:\no\tThe recommendation describes new control mechanisms or procedures at an operational level.\no\tIt is about the activities (not policies) for designing or refining controls that prevent errors, underpayments, overpayments, or fraud before they occur.\no\tIf a recommendation instructs an agency or program to compel another organization to take an action in accordance with a law, regulation, or policy, categorize it as “Design & Implementation of Controls.”\no\tThe recommendation describes how to target oversight or control activities, without references to detection methodologies or responses to identified instance of improper payments or fraud.\n•\tExamples:\no\tWe recommend that the Nevada Department of Health Services revise its State plan to clarify documentation standards that care coordination providers must meet to bill and receive per-member, per-month payments for outreach services, and provide training to ensure compliance.\no\tThe Deputy Secretary of the Department of Workforce Development should oversee states' adherence to the updated job search verification requirements.\no\tThe Office of Grant Oversight should develop and publicly release corrective action plan details in alignment with federal guidance.\no\tEnsure that all eligibility criteria, including asset-related requirements, are properly verified during annual renewals for all existing beneficiaries.\no\tWe recommend that the agency review and, if necessary, reassess the eligibility of sampled individuals who may not have met federal and state eligibility criteria.\no\tWe recommend that the agency ensure case files contain adequate documentation to demonstrate that eligibility determinations comply with federal and state requirements.\n\n4. Detection\n•\tFocus:\no\tIdentifying instances of improper payments, including fraud, underpayments, overpayments, or errors, through audits, reviews, or data analysis.\no\tFollow-up actions to detect additional cases or instances of improper payments that were originally identified during a review or audit.\no\tCatching discrepancies in payment records in real time or retrospectively.\n•\tWhen to Use:\no\tThe recommendation specifically addresses how to identify or uncover issues and risks related to program integrity.\no\tIt references activities and implementation of detection methodologies or systems, such as data matching, sampling audits or cases specifically, monitoring to identify improper payments, use of hotlines, making of referrals, or establishing whistleblower programs.\n•\tExamples:\no\tThe Secretary of the Army should ensure that the R&D Innovation Program tracks referrals to the Army Office of Inspector General and the suspension and debarment officials.\no\tWe recommend that Summit Health review the high-risk diagnoses identified in the report, investigate similar cases of noncompliance occurring outside the audit period, and reimburse the federal government for any overpayments.\no\tThe Secretary of the Coast Guard should ensure that the Small Business Innovation Program tracks referrals to the Office of Inspector General or the Coast Guard Investigative Service.\no\tHFA should conduct routine oversight and periodic monitoring to identify managed care organizations with an excessive share of risk-adjusted payments originating from retrospective chart reviews and health risk assessments.\n\n5. Data & Technology\n•\tFocus:\no\tAny recommendation that explicitly involves data governance, system modernization, IT systems, cybersecurity, cloud infrastructure, or other foundational technologies for improving program integrity and data-driven approaches.\no\tRecommendations that target the development of or improvements to dashboards for visualizing data used for program integrity, even if it refers to other themes, such as the use of dashboards for assessing (Risk Assessment) or detecting risks (Detection).\n•\tWhen to Use:\no\tUse this category only if technology or the use of data is the central focus of the recommendation and it has broad applications for the agency or program, even if the recommendation is relevant for other themes.\no\tThe text mentions upgrading or implementing new data systems, analytics tools, dashboards, r activities, or processes for improving the collection of information and data to support program integrity.\no\tIf the recommendation is about a technical process of how to collect information or data, such as an improvement to an IT system, then categorize it as “Data and Technology.”\no\tIf the recommendation is about a process to improve the collection of information or data, but is not related to technical aspects, then categorize it under “Governance and Capacity.”\n•\tExamples:\no\tWe recommend that the agency strengthen oversight of the Performance-Based Hospital Incentive Program to ensure that (1) its contractor retains the claims data necessary to verify hospital eligibility for incentive payments and (2) hospitals submit performance data in alignment with established reporting criteria.\no\tWe recommend that the Virgin Islands Department of Health establish formal policies and procedures for verifying deceased enrollees using sources beyond the territory’s official vital records registry.\no\tEnhance the cloud service agreements with all vendors to reinforce protections for data confidentiality and integrity.\no\tWe recommend that the Guam Department of Health implement written guidelines to verify deceased enrollees using additional data sources beyond the Guam Vital Records Office.\no\tThe Administrator of HFA should collect and maintain standardized provider-specific data on Medicaid payments, including newly introduced state-directed managed care payments and states’ funding sources for the nonfederal share.\n\n6. Response & Evaluation\n•\tFocus:\no\tActions taken after improper payments, fraud, convictions or adverse actions are detected, with the exception of overarching policies and detecting similar instances of improper payments.\no\tRecovering funds, enforcing corrective actions, implementing sanctions, suspending and revoking permissions, or evaluating ongoing performance to prevent future issues.\no\tReporting findings, following the identification of fraud or improper payments, including annual data calls\no\tIncludes the estimation and evaluation of improper payment rates as part of performance metrics, including any references to sampling and estimation plans that do not concentrate on specific audits, cases, or control activities\no\tIdentifying and analyzing trends and patterns after improper payments are identified or based on findings from recent findings from audits or investigations.\no\tTracking referrals of potential improper payments to relevant bodies like OIGs or audit bodies.\no\tIncludes identifying areas for control improvement, remedying controls or enforcement mechanisms after improper payments are identified.\n•\tWhen to Use:\no\tThe recommendation calls for recovering funds, imposing penalties, or adjusting processes after errors or fraud have been identified.\no\tIt refers to post-payment reviews, returning improper funds, updating performance metrics, or estimating and evaluating improper payment rates.\no\tWhen it mentions developing a corrective action plan as an evaluation tool for enhancing program integrity or risk mitigation. If it mentions developing or implementing a corrective action plan in the context of complying with laws or regulations, it should go under “Design & Implementation of Controls”\n•\tExamples:\no\tWe recommend that the Procurement Officer disallow $1,083,534 in overcharges to the Federal Benefits Plan due to processing errors. So far, $228,641 has been recovered, leaving $854,893 outstanding.\no\tFinalize and implement the planned upgrade of the debt recovery system to enable collection of overpayments from ineligible debtors.\no\tFor the Digital Access Program, the Administrator of CTA should ensure that the designated oversight body evaluates the adequacy of existing antifraud measures and prioritizes remaining fraud risks.\no\tTo better identify and mitigate the full extent of improper payments in the Military Health Program, and following the implementation of a more comprehensive improper payment error methodology, the Secretary of Homeland Security should instruct the Assistant Secretary for Health Services to develop stronger corrective action strategies targeting root causes of improper payments identified through medical record reviews.\no\tThe Office of Financial Oversight should continue publishing improper payment estimates for the Rail Health Program in federal data submissions until the budget office either formally approves discontinuation of reporting or finalizes an agreement with the Health Administration Agency on how Rail Health payments will be documented.\nTo strengthen program integrity and address identified control gaps in the Connectivity Assistance Program, the Chairperson of FTA should establish deadlines for reviewing compliance plans and create clear evaluation criteria for agency reviewers to assess whether these plans align with program objectives.\n\n7. Other\n•\tFocus:\no\tRecommendations that appear to be out of scope of program integrity, improper payments, or fraud related to government programs, or are not easily categorized into one of the areas above.\n•\tWhen to Use:\no\tUse if the recommendation is too vague, lacks enough context, or does not clearly fit into any of the categories above.\no\tUse if the recommendation is about broader financial management or public governance issues, without even an implied linkage to program integrity or fraud prevention.\n•\tExamples:\no\tEnhance oversight processes. (No clarity on whether it’s about assessment, detection, or controls.)\no\tThe Secretary of Commerce, as part of the agency’s efforts in equity analysis for economic policy, should assess the feasibility of alternative approaches, such as interagency data integration or targeted surveys, to securely generate linked taxpayer and demographic data.  (This topic is outside the scope of program integrity, as it relates to broader economic policy and governance issues.)\no\tWe recommend that the Department update its policies to clarify whether any provisions of 28 C.F.R. 50.2 remain in effect given the Confidentiality and Media Contacts Policy outlined in the Justice Manual. (This is about election fraud, which is out of scope.)\no\tThe Administrator of the Maritime Safety Agency should ensure that the Director of Inspections and Compliance updates vessel accident investigation protocols to mandate collection of data on date of birth, known disability, and use of lifesaving equipment for individuals involved in water immersion casualties or those who utilized lifesaving gear. (While it references investigations, it is not relevant for program integrity.)\nInstructions\n\n\n3.\tDecision Flow\no\tDetermine if the recommendation is primarily about one of the categories above.\no\tCheck if the text explicitly references data/technology. If the technology element is the central focus, choose “Data & Technology.”\no\tIf the text is too vague, choose “Other.”\n\n    ===================================================\n\n<recommendation_text>\n\nThe Commissioner of Internal Revenue should update IRS's monitoring programs for electronic return originators to include techniques to monitor basic information security and cybersecurity issues. Further, IRS should make the appropriate revisions to internal guidance, job aids, and staff training, as necessary. (Recommendation 5)\n\n</recommendation_text>\n\n    Instructions:\n    - Your response MUST be one of:     \"Governance & Capacity\",\"Risk Assessment\",\"Design & Implementation of Controls\",\"Detection\",\"Response & Evaluation\",\"Data & Technology\",\"Other\"\n    - If no category applies, category is \"Other\" "
ideal: Data & Technology
